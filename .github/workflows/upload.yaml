name: Check and upload

on:
  push:
    branches: [main, master]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
      - name: Check and test Calcit
        run: |
          set -euo pipefail
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --check-only --all-defs --format json
          calcit --check-only --ns app.config --ns app.main --ns app.schema --ns app.updater --ns app.util --ns app.comp.container --ns app.comp.showcase --summary-only --format json
          calcit analyze weak-types --ns-prefix app --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit test --require-match --summary-only --format json
      - name: Build frontend
        run: |
          calcit js
          yarn vite build --base="https://cos-sh.tiye.me/${GITHUB_REPOSITORY}/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cos-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: client-dist
          path: dist/
      - name: Upload and verify frontend resources
        uses: worktools/cos-upload-action@v1.2.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ github.repository }}/
          public-base-url: https://cos-sh.tiye.me/${{ github.repository }}/
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Deploy to original server path
        uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
